[package]
name = "nebula-resilience"
description = "Internal Nebula resilience layer for outbound calls: retry, timeout, circuit breaker, bulkhead, rate limiting, fallback, and hedging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
readme = "README.md"
keywords = ["nebula", "resilience", "retry", "workflow", "reliability"]
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
# Keep boundary type serialization enabled by default for backwards compatibility.
default = ["serde"]

# Enables serde for config/value boundary types.
serde = ["dep:serde", "smallvec/serde"]

# Exposes internal helpers the criterion benches measure directly. Not part
# of the documented surface: enabling it adds no behavior, only visibility.
bench-internals = []

# The `LimitStore` conformance kit, for the test suites of store
# implementations. Test support only: it panics on a violation.
conformance = []

[dependencies]
# Nebula integration
nebula-error = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

# Error derivation and observability
thiserror = { workspace = true }
tracing = { workspace = true }

# Synchronization and compact storage
parking_lot = { workspace = true }
smallvec = { version = "1.15", features = ["union"] }

# Retry jitter
fastrand = "2.4"

# Optional feature dependencies
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
proptest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[package.metadata.docs.rs]
# Render feature-gated items on docs.rs (build with every feature).
all-features = true

[lints]
workspace = true

[[bench]]
name = "compose"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "rate_limiter"
harness = false

[[bench]]
name = "timeout"
harness = false

[[bench]]
name = "fallback"
harness = false

[[bench]]
name = "circuit_breaker"
harness = false

[[bench]]
name = "bulkhead"
harness = false

[[bench]]
name = "latency_tracker"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "retry"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "cancellation"
harness = false

[[bench]]
name = "gate"
harness = false

[[bench]]
name = "load_shed"
harness = false

[[bench]]
name = "call_context"
harness = false

[[bench]]
name = "hedge"
harness = false
required-features = ["bench-internals"]
