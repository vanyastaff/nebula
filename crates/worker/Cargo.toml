[package]
name = "nebula-worker"
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
authors.workspace = true
description = "Durable execution worker runtime for control, recovery, and timer processing"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true

[dependencies]
nebula-core = { path = "../core" }
nebula-engine = { path = "../engine" }
nebula-storage-port = { path = "../storage-port" }

tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
nebula-metrics = { path = "../metrics" }
nebula-orchestrator = { path = "../orchestrator" }
nebula-plugin = { path = "../plugin" }
nebula-storage = { path = "../storage", features = ["sqlite", "postgres"] }
nebula-action = { path = "../action" }
nebula-workflow = { path = "../workflow" }
nebula-execution = { path = "../execution" }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "test-util"] }
serde_json = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true, features = ["sqlite", "postgres", "runtime-tokio"] }
tempfile = { workspace = true }
ulid = { workspace = true }
async-trait = { workspace = true }

[lib]
doctest = false

[lints]
workspace = true
