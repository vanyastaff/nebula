[package]
name = "nebula-api-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
authors.workspace = true
description = "Versioned Nebula HTTP transport contract"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
# Do not inherit the server's axum_extras feature into this wire boundary.
utoipa = { version = "5.5", default-features = false, features = ["macros"], optional = true }

[features]
default = []
openapi = ["dep:utoipa"]

[lints]
workspace = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
  "serde",
  "serde_core::*",
  "serde_derive::*",
  "serde_json",
  "serde_json::*",
  "uuid::*",
  "zeroize::*",
  "utoipa::*",
]
