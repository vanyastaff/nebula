[package]
name = "nebula-error"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Enterprise error infrastructure for the Nebula workflow engine"
keywords.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[dependencies]

[dependencies.serde]
workspace = true
optional = true

[dependencies.serde_json]
workspace = true
optional = true

[dependencies.nebula-error-macros]
path = "macros"
optional = true

[features]
default = []
serde = ["dep:serde"]
derive = ["dep:nebula-error-macros"]
# Value-free `serde_json::Error` summarization (`decode` module), the single
# copy every consuming crate depends on — see `decode`'s doc for why the
# helper lives here instead of in each consumer.
serde_json = ["dep:serde_json"]

[dev-dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
nebula-error-macros = { path = "macros" }
insta = { workspace = true }
pretty_assertions = { workspace = true }
rstest = { workspace = true }

[package.metadata.docs.rs]
# Render feature-gated items on docs.rs (build with every feature).
all-features = true

[lints]
workspace = true
