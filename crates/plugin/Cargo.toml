[package]
name = "nebula-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
authors.workspace = true
description = "In-process plugin registration, immutable flavor identity, and registry"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
default = []

[dependencies]
nebula-plugin-macros = { path = "macros" }
nebula-core = { path = "../core" }
nebula-error = { workspace = true, features = ["derive"] }
nebula-metadata = { path = "../metadata" }
nebula-action = { path = "../action" }
nebula-credential = { path = "../credential" }
nebula-resource = { path = "../resource" }
nebula-schema = { path = "../schema" }
nebula-workflow = { path = "../workflow" }

indexmap = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = "1"
tracing = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
