name: Test Matrix

on:
  push:
    branches: [main]
  # Pull requests always run because `Tests` is a required check. Pushes also
  # always reach this workflow: event-level path filters must not bypass the
  # sole package selector. The selector emits an empty matrix only for
  # repository-level, unowned docs/assets diffs; package-local docs/assets
  # still select their owner and reverse dependents.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-matrix:
    name: Select Matrix Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
      storage_selected: ${{ steps.select.outputs.storage_selected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1

      - name: Validate North Star gate policy
        run: cargo xtask north-star-gates validate

      - name: Select packages to test
        id: select
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail

          plan_args=(ci-plan full)
          if [[ "$EVENT" == "pull_request" ]]; then
            plan_args=(
              ci-plan diff
              --base "$PR_BASE_SHA"
              --head "$PR_HEAD_SHA"
              --comparison merge-base
            )
          elif [[ "$EVENT" == "merge_group" ]]; then
            plan_args=(
              ci-plan diff
              --base "$MG_BASE_SHA"
              --head "$MG_HEAD_SHA"
              --comparison direct
            )
          fi

          plan_file="$RUNNER_TEMP/nebula-ci-plan.json"
          cargo xtask "${plan_args[@]}" > "$plan_file"

          bytes=$(wc -c < "$plan_file")
          if (( bytes > 460800 )); then
            echo "::error::CI plan exceeds the conservative 450 KiB output limit"
            exit 1
          fi

          jq -e '
            ((keys | sort) == ["count", "include", "reason", "schema_version", "scope"]) and
            (.schema_version == 1) and
            (.scope == "full" or .scope == "diff") and
            ((.reason | type) == "string") and
            ((.count | type) == "number") and
            (.count >= 0 and .count <= 256 and .count == (.count | floor)) and
            ((.include | type) == "array") and
            (.count == (.include | length)) and
            ([.include[].package] == ([.include[].package] | sort | unique)) and
            all(.include[];
              ((keys | sort) == ["package", "test_features"]) and
              ((.package | type) == "string") and
              (.package | length) > 0 and
              ((.test_features | type) == "array") and
              (.test_features == (.test_features | sort | unique)) and
              all(.test_features[]; type == "string")
            )
          ' "$plan_file" > /dev/null

          matrix=$(jq -c '{include: .include}' "$plan_file")
          count=$(jq -r '.count' "$plan_file")
          storage_selected=$(jq -r 'any(.include[]; .package == "nebula-storage")' "$plan_file")
          {
            echo "matrix=$matrix"
            echo "count=$count"
            echo "storage_selected=$storage_selected"
          } >> "$GITHUB_OUTPUT"

  test-crates:
    name: Test ${{ matrix.package }}
    needs: [select-matrix]
    if: needs.select-matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.9.1
        with:
          key: ${{ matrix.package }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@481c34c1cf3a84c68b5e46f4eccfc82af798415a # v2.75.23
        with:
          tool: cargo-nextest@0.9.143

      - name: Run tests for ${{ matrix.package }}
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          TEST_FEATURES: ${{ join(matrix.test_features, ',') }}
        run: |
          set -euo pipefail
          if [[ "$PKG" == "nebula-api" ]]; then
            mkdir -p target/activation-diagnostics
            export NEBULA_ACTIVATION_DIAGNOSTICS_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/activation-diagnostics/report.json
          fi
          command=(cargo nextest run -p "$PKG")
          if [[ -n "$TEST_FEATURES" ]]; then
            command+=(--features "$TEST_FEATURES")
          fi
          command+=(--profile ci --no-tests=pass)
          "${command[@]}"

      - name: Test summary
        if: always()
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86 # v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          paths: target/nextest/ci/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ matrix.package }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 3

      # The activation-diagnostic report names which rejections report which
      # fields. A green exit code proves the suite ran; the report is what says
      # what it found, so it is retained rather than re-derived.
      - name: Upload activation-diagnostic contract report
        if: always() && matrix.package == 'nebula-api'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: activation-diagnostic-contract
          path: target/activation-diagnostics/report.json
          if-no-files-found: error
          retention-days: 14

  postgres-conformance:
    name: PostgreSQL storage conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nebula_test?sslmode=disable
      NEBULA_REQUIRE_POSTGRES: "1"
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nebula_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nebula_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.9.1
        with:
          key: nebula-storage-postgres-conformance
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@481c34c1cf3a84c68b5e46f4eccfc82af798415a # v2.75.23
        with:
          tool: cargo-nextest@0.9.143

      - name: Run PostgreSQL storage conformance
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            target/runtime-authority/start-authority \
            target/runtime-authority/claim-fencing \
            target/runtime-authority/claim-handoff \
            target/runtime-authority/persistence-authority \
            target/runtime-authority/required-postgresql \
            target/runtime-authority/ordered-migrations \
            target/runtime-authority/remote-effects \
            target/runtime-authority/checkpoint-reconnect
          export NEBULA_POSTGRES_REQUIREMENT_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/required-postgresql/enabled.json
          export NEBULA_ORDERED_MIGRATIONS_SQLITE_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/ordered-migrations/sqlite.json
          export NEBULA_ORDERED_MIGRATIONS_POSTGRES_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/ordered-migrations/postgresql.json
          export NEBULA_CLAIM_HANDOFF_IN_MEMORY_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/claim-handoff/in-memory.json
          export NEBULA_CLAIM_HANDOFF_SQLITE_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/claim-handoff/sqlite.json
          export NEBULA_CLAIM_HANDOFF_POSTGRES_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/claim-handoff/postgresql.json
          export NEBULA_REMOTE_EFFECT_IN_MEMORY_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/remote-effects/in-memory.json
          export NEBULA_REMOTE_EFFECT_SQLITE_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/remote-effects/sqlite.json
          export NEBULA_REMOTE_EFFECT_POSTGRES_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/remote-effects/postgresql.json
          export NEBULA_CHECKPOINT_RECONNECT_IN_MEMORY_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/checkpoint-reconnect/in-memory.json
          export NEBULA_CHECKPOINT_RECONNECT_SQLITE_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/checkpoint-reconnect/sqlite.json
          export NEBULA_CHECKPOINT_RECONNECT_POSTGRES_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/checkpoint-reconnect/postgresql.json

          common=(
            -p nebula-storage
            --no-default-features
            --features postgres
            --profile ci
            --no-tests=fail
          )

          # Keep lifecycle selection limited to fixtures that own isolated
          # PostgreSQL schemas. Broad storage selection would also run
          # unrelated legacy integration tests against `public`; the
          # pre-existing authority set is preserved explicitly below.
          cargo nextest run "${common[@]}" \
            --lib post_commit_ack_loss_is_unknown_and_is_not_retried
          cargo nextest run "${common[@]}" \
            --lib commit_sqlstate_classification_preserves_unknown_outcomes
          cargo nextest run "${common[@]}" \
            --lib observation_fetch_errors_distinguish_schema_evidence_from_unavailability
          cargo nextest run "${common[@]}" --lib semantic_oracle

          # Preserve the pre-K2 live PostgreSQL authority gate. These tests
          # predate the credential lifecycle suites and remain part of the
          # required storage contract.
          #
          # `pg::control_queue::tests` is required here because the claim
          # statement is assembled at runtime (`AssertSqlSafe`) and is never
          # type-checked at compile time: issue #756 shipped an ambiguous
          # `RETURNING` projection that failed every claim, and no compile-only
          # or SQLite test could observe it. Those tests hold a PostgreSQL
          # advisory lock, so they serialise correctly against each other even
          # though nextest runs each in its own process.
          cargo nextest run "${common[@]}" \
            -E 'package(=nebula-storage) & binary(=nebula_storage) & test(/pg::(oauth_state::tests|identity_secret::postgres_tests|session::tests|mfa_enrollment::tests|control_queue::tests)::/)'

          # `conformance` and `identity_conformance` are the shared semantic
          # oracles: the same assertions run against InMemory, SQLite, and
          # PostgreSQL. Their PostgreSQL arm skip-cleans without DATABASE_URL,
          # so leaving them out of this job meant the "shared" oracle had never
          # actually run against PostgreSQL — and did not, in fact, hold. Each
          # backend instance now takes a private schema, so they are safe to
          # run here and against each other.
          for suite in \
            conformance \
            identity_conformance \
            credential_lifecycle_postgres \
            credential_migration_postgres \
            credential_schema_admission_postgres \
            execution_state_bounds \
            operation_ledger_conformance_postgres \
            postgres_control_queue_atomicity \
            refresh_claim_pg_integration \
            resource_fanout_conformance_postgres \
            revision_catalog_conformance_postgres \
            revision_catalog_migration_postgres \
            schema_setup_postgres \
            turn_handoff_conformance_postgres
          do
            cargo nextest run "${common[@]}" --test "$suite"
          done

          NEBULA_POSTGRES_REQUIREMENT_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/required-postgresql/disabled.json \
            cargo nextest run -p nebula-storage --no-default-features --test conformance \
            -E 'test(required_postgres_feature_absence_observations)' --profile ci

          NEBULA_START_AUTHORITY_IN_MEMORY_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/start-authority/in-memory.json \
          NEBULA_START_AUTHORITY_SQLITE_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/start-authority/sqlite.json \
          NEBULA_START_AUTHORITY_POSTGRES_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/start-authority/postgresql.json \
            cargo nextest run -p nebula-storage --features sqlite,postgres \
            --test start_materialization --profile ci

          NEBULA_CLAIM_FENCING_IN_MEMORY_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/claim-fencing/in-memory.json \
          NEBULA_CLAIM_FENCING_SQLITE_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/claim-fencing/sqlite.json \
          NEBULA_CLAIM_FENCING_POSTGRES_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/claim-fencing/postgresql.json \
          NEBULA_PERSISTENCE_AUTHORITY_IN_MEMORY_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/persistence-authority/in-memory.json \
          NEBULA_PERSISTENCE_AUTHORITY_SQLITE_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/persistence-authority/sqlite.json \
          NEBULA_PERSISTENCE_AUTHORITY_POSTGRES_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/persistence-authority/postgresql.json \
            cargo nextest run -p nebula-storage --features sqlite,postgres \
            --test conformance \
            -E 'test(claim_generation_raw_observations) | test(persistence_authority_raw_observations)' \
            --profile ci

          cargo nextest run -p nebula-storage --features sqlite,postgres \
            --test ordered_migration_observations --profile ci

          cargo nextest run -p nebula-engine --profile ci \
            --test durable_checkpoint_reconnect --test effect_protocol
          cargo nextest run -p nebula-worker --profile ci --test accepted_turn_recovery

          NEBULA_ACTIVATION_DIAGNOSTICS_OBSERVATIONS_PATH="$GITHUB_WORKSPACE"/target/runtime-authority/activation-diagnostics/report.json \
            cargo nextest run -p nebula-api --profile ci \
            --test activation_diagnostic_contract \
            -E 'test(records_actual_compiler_and_http_diagnostics)'

      - name: Assemble producer-owned runtime-authority candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask north-star-gates build-runtime-authority-bundle \
            --observation-root target/runtime-authority \
            --artifact-root target/runtime-authority-bundle \
            --expected-provenance target/runtime-authority-expected.json \
            --source-revision "${{ github.sha }}" \
            --repository "${{ github.repository }}" \
            --workflow-path ".github/workflows/test-matrix.yml" \
            --job-id "postgres-conformance" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --toolchain "rustc 1.97.1"

      - name: Upload PostgreSQL and migration observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-authority-candidate
          path: |
            target/runtime-authority
            target/runtime-authority-bundle
            target/runtime-authority-expected.json
          if-no-files-found: error
          retention-days: 14

      - name: Test summary
        if: always()
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86 # v2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          paths: target/nextest/ci/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-nebula-storage-postgres-conformance
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 3

  runtime-authority:
    name: Runtime authority evidence
    needs: [postgres-conformance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.97.1

      - name: Download producer-owned evidence candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: runtime-authority-candidate
          path: target/runtime-authority-candidate

      - name: Verify producer-owned runtime-authority bundle
        shell: bash
        run: |
          set -euo pipefail
          # The identity comes from this job's own runner context, never from
          # the downloaded artifact: provenance that is recorded but compared
          # to nothing admits a bundle produced anywhere.
          cargo xtask north-star-gates verify-runtime-authority \
            --artifact-root target/runtime-authority-candidate/runtime-authority-bundle \
            --expected-provenance target/runtime-authority-candidate/runtime-authority-expected.json \
            --source-revision "${{ github.sha }}" \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            > target/runtime-authority-effective-states.json

      - name: Retain verified runtime-authority bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-authority-bundle
          path: |
            target/runtime-authority-candidate/runtime-authority-bundle
            target/runtime-authority-candidate/runtime-authority-expected.json
            target/runtime-authority-effective-states.json
          if-no-files-found: error
          retention-days: 14

  # Branch protection points at this stable required check.
  tests:
    name: Tests
    needs: [select-matrix, test-crates, postgres-conformance, runtime-authority]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate matrix results
        shell: bash
        env:
          SELECT_RESULT: ${{ needs.select-matrix.result }}
          TEST_RESULT: ${{ needs.test-crates.result }}
          SELECTED_COUNT: ${{ needs.select-matrix.outputs.count }}
          STORAGE_SELECTED: ${{ needs.select-matrix.outputs.storage_selected }}
          POSTGRES_CONFORMANCE_RESULT: ${{ needs.postgres-conformance.result }}
          RUNTIME_AUTHORITY_RESULT: ${{ needs.runtime-authority.result }}
        run: |
          set -euo pipefail

          if [[ "$SELECT_RESULT" != "success" ]]; then
            echo "::error::select-matrix result: $SELECT_RESULT"
            exit 1
          fi
          if [[ ! "$SELECTED_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::select-matrix emitted invalid count: $SELECTED_COUNT"
            exit 1
          fi
          if [[ "$STORAGE_SELECTED" != "true" && "$STORAGE_SELECTED" != "false" ]]; then
            echo "::error::select-matrix emitted invalid storage-selected: $STORAGE_SELECTED"
            exit 1
          fi
          if [[ "$POSTGRES_CONFORMANCE_RESULT" == "success" ]]; then
            echo "PostgreSQL storage conformance passed."
          else
            echo "::error::postgres-conformance result: $POSTGRES_CONFORMANCE_RESULT"
            exit 1
          fi
          if [[ "$RUNTIME_AUTHORITY_RESULT" != "success" ]]; then
            echo "::error::runtime-authority result: $RUNTIME_AUTHORITY_RESULT"
            exit 1
          fi
          if [[ "$SELECTED_COUNT" == "0" ]]; then
            if [[ "$TEST_RESULT" != "skipped" ]]; then
              echo "::error::test-crates must be skipped for an empty matrix; got $TEST_RESULT"
              exit 1
            fi
            echo "No package tests were required for this diff."
          elif [[ "$TEST_RESULT" != "success" ]]; then
            echo "::error::test-crates result: $TEST_RESULT"
            exit 1
          else
            echo "All selected package tests passed."
          fi
