name: Hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos-and-toml:
    name: typos + taplo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install typos-cli
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: typos-cli

      - name: Install taplo-cli
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: taplo-cli

      - name: Check spelling
        run: typos

      - name: Check TOML formatting
        run: taplo fmt --check .

  # ── Workflow security audit (ENGINEERING_2026 C12; uv/reth precedent) ─────
  # Gate on high severity: excessive permissions, template injection into
  # `run:` blocks, etc. Medium findings (persist-credentials on checkouts)
  # are tracked as follow-up and intentionally not blocking yet.
  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zizmor
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: zizmor
      - name: Audit workflows (high severity blocks)
        run: zizmor --no-progress --min-severity high .github/workflows/

  # ── Duplicate-code detector (report-only) ────────────────────────────────
  # Readability & Design Standard (AGENTS.md): AST-level similarity across
  # `crates/` and `apps/`. Non-blocking while the existing src duplication is
  # worked down; the artifact and step summary are the review reference. To
  # become a growth gate after the hotspot cleanup.
  duplicate-code:
    name: duplicate code (report)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install similarity-rs (pinned release, SHA-verified)
        run: |
          cd "$(mktemp -d)"
          curl -fsSLO https://github.com/mizchi/similarity/releases/download/v0.5.0/similarity-v0.5.0-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO https://github.com/mizchi/similarity/releases/download/v0.5.0/SHA256SUMS.txt
          sha256sum --check --ignore-missing SHA256SUMS.txt
          tar xzf similarity-v0.5.0-x86_64-unknown-linux-gnu.tar.gz
          sudo install similarity-v0.5.0-x86_64-unknown-linux-gnu/similarity-rs /usr/local/bin/

      - name: Detect duplicate code across crates
        run: |
          similarity-rs crates apps --min-lines 10 > duplicate-report.txt || true
          {
            echo "## Duplicate-code report (report-only)"
            echo
            echo "\`--min-lines 10\`; full listing in the \`duplicate-report\` artifact."
            tail -n 1 duplicate-report.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: duplicate-report
          path: duplicate-report.txt
