name: SemVer Checks

on:
  pull_request:
    paths:
      - "crates/**/Cargo.toml"
      - "crates/**/src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@481c34c1cf3a84c68b5e46f4eccfc82af798415a # v2.75.23
        with:
          tool: cargo-semver-checks
      - name: Run cargo-semver-checks against the pull-request base
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base_revision="$BASE_REVISION"
          if ! git cat-file -e "${base_revision}^{commit}" 2>/dev/null; then
            base_revision="$(git merge-base HEAD "origin/$BASE_BRANCH")"
          fi
          cargo semver-checks check-release --workspace --baseline-rev "$base_revision"
