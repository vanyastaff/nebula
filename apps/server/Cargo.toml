[package]
name = "nebula-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "nebula-server"
path = "src/main.rs"

[lib]
name = "nebula_server"
path = "src/lib.rs"

[[test]]
name = "runtime_repair_red_scenarios"
path = "tests/runtime_repair_red_scenarios.rs"

[dependencies]
nebula-api = { path = "../../crates/api", features = ["first-party-composition"] }
# In-memory adapters and the SQLite/Postgres execution-store paths live in
# nebula-storage. The `sqlite` feature enables SqliteConnectOptions/Pool/stores;
# PG-backed stores are gated behind the `postgres` cargo feature.
nebula-storage = { path = "../../crates/storage", features = ["credential-in-memory", "sqlite"] }
# Direct dep: `ExecutionStoreBundle` in compose.rs names the port trait objects
# (`WorkflowStore`, `ControlQueue`, `TriggerDedupInbox`, …) directly, so the
# storage-port crate must be a real dependency, not accessed through re-exports.
# nebula-server is in deny.toml's nebula-storage-port `wrappers` allowlist.
nebula-storage-port = { path = "../../crates/storage-port" }
# First-party trust bridge: the server composition root binds API-authenticated
# principals to the credential-owned authority/controller. Neither dependency
# crosses into API handlers or wire DTOs.
nebula-credential = { path = "../../crates/credential" }
nebula-engine = { path = "../../crates/engine" }
nebula-tenancy = { path = "../../crates/tenancy" }
nebula-core = { path = "../../crates/core" }
nebula-schema = { path = "../../crates/schema", features = ["schemars"] }
# Reused only by the evidence-only runtime-repair profile. The ordinary server
# does not link the worker composition root.
nebula-worker-bin = { path = "../worker", optional = true }
# Ephemeral execution observations used only by the runtime-repair evidence
# profile. Durable state remains authoritative.
nebula-eventbus = { path = "../../crates/eventbus", optional = true }
# Composition root wires a process-wide `MetricsRegistry` and attaches the OTLP push
# pipeline via `TelemetryGuard::attach_metrics_exporter`. Direct dep so the surface stays
# stable across api re-export refactors.
nebula-metrics = { path = "../../crates/metrics" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
axum = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
secrecy = { workspace = true }
chrono = { workspace = true, optional = true }
zeroize = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, default-features = false, features = [
  "json",
  "rustls",
  "form",
  "stream",
] }
# Production SMTP transport for the `EmailPort`. The trait + dev EchoSink live
# in nebula-api; the lettre-backed impl lives here so the api crate stays free
# of the lettre direct dep (and library consumers of nebula-api do not pull
# lettre transitively).
lettre = { workspace = true }
# SQLite + Postgres: a single sqlx dep with sqlite always enabled (the durable
# single-process backend), and postgres + TLS enabled by the `postgres` cargo
# feature. This mirrors how the worker binary wires sqlx across its two paths.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }

[features]
postgres = [
  "nebula-api/postgres",
  "nebula-storage/postgres",
  "nebula-worker-bin?/postgres",
  "sqlx/postgres",
  "sqlx/tls-rustls-ring-native-roots",
]
runtime-repair-red = [
  "dep:nebula-worker-bin",
  "nebula-worker-bin/runtime-repair-red",
  "dep:nebula-eventbus",
  "dep:chrono",
  "nebula-api/test-util",
]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
nebula-action = { path = "../../crates/action" }
# Activate the `test-util` feature of nebula-api for tests — exposes
# `ApiConfig::for_test()`. Cargo unions features from [dependencies] and
# [dev-dependencies], so this only activates the feature in test builds.
nebula-api = { path = "../../crates/api", features = ["test-util"] }
rcgen = { workspace = true }
tokio-rustls = { workspace = true }

[lints]
workspace = true
