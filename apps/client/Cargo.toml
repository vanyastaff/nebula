[package]
name = "nebula-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "First-party desktop and browser workflow client"

[lib]
name = "nebula_client_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nebula-client"
path = "src/main.rs"
required-features = ["ui"]

[features]
default = ["ui"]
# The library is empty without `ui`, so its UI-only deps are gated with it.
ui = [
  "dep:eframe",
  "dep:nebula-api-contract",
  "dep:reqwest",
  "dep:serde",
  "dep:serde_json",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing",
  "dep:url",
  "dep:uuid",
  "dep:zeroize",
]

[dependencies]
nebula-api-contract = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
uuid = { version = "1", optional = true, features = ["v4", "js"] }
eframe = { version = "=0.37.0", optional = true, default-features = false, features = [
  "default_fonts",
  "glow",
  "accesskit",
  "wayland",
  "x11",
  "web_screen_reader",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true, features = ["rustls", "stream"] }
tokio = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlCanvasElement"] }

[dev-dependencies]
wiremock = "0.6"

[lints]
workspace = true
