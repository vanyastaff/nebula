# Must list exactly the advisory IDs `deny.toml` ignores; the security-audit
# workflow fails when the two sets differ. The reasons live in deny.toml.
[advisories]
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]

[output]
format = "terminal"
quiet = false
