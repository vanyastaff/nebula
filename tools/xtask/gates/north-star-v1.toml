state = "red"
state_reason = "Exact flavor identity is stored but does not yet govern every claim and dispatch path."
activation_checkpoint = "CP2"
backends = ["in-memory", "sqlite", "postgresql"]
required_ci = [
  ".github/workflows/test-matrix.yml#tests",
  ".github/workflows/test-matrix.yml#postgres-conformance",
]

[gates.evidence]
kind = "conformance-report"
schema_version = 1
schema_path = "tools/xtask/schemas/gate-evidence-v1.schema.json"
artifact_path = "artifacts/north-star/v1/ns01.json"

[gates.threshold]
kind = "required-set"
metric = "non_terminal_execution_identity_fields"
required_values = ["bundle_revision", "workflow_revision", "flavor_revision"]

[[gates]]
id = "NS02"
statement = "Missing revisions produce typed fail-closed results; latest fallback count is zero."
owner = "api-design-lead"
state = "red"
state_reason = "The exact-load and drain contract is not complete and latest fallback remains reachable."
activation_checkpoint = "CP2"
backends = ["in-memory", "sqlite", "postgresql"]
