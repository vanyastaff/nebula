metrics = [
  "latest_revision_fallback_count",
  "untyped_missing_revision_result_count",
  "missing_revision_success_count",
]

[[gates]]
id = "NS03"
statement = "A stale claim generation cannot change a reclaimed row in any backend."
owner = "async-systems-lead"
state = "partial"
state_reason = "Acknowledgement is fenced on a storage-minted, monotonic claim generation, and the shared same-processor ABA oracle passes on in-memory, SQLite, and live PostgreSQL while asserting the fenced call leaves the row unchanged. Held at partial rather than promoted: registry schema v1 deliberately cannot represent trustworthy promotion, and the conformance-report artifact this gate declares is not yet emitted."
activation_checkpoint = "CP2"
backends = ["in-memory", "sqlite", "postgresql"]
required_ci = [
  ".github/workflows/test-matrix.yml#tests",
  ".github/workflows/test-matrix.yml#postgres-conformance",
]

[gates.evidence]
kind = "conformance-report"
schema_version = 1
schema_path = "tools/xtask/schemas/gate-evidence-v1.schema.json"
artifact_path = "artifacts/north-star/v1/ns03.json"

[gates.threshold]
kind = "zero"
metrics = ["stale_generation_mutation_count"]

[[gates]]
id = "NS04"
statement = "Ambiguous acceptance retries create exactly one durable drive identity."
owner = "async-systems-lead"
state = "partial"
state_reason = "Keyed start acceptance reserves the start key, creates the execution aggregate, and enqueues its Start command in one commit; the shared oracle proves a retry converges on the original receipt and a differing request is refused with no durable delta, on all three backends. Held at partial rather than promoted: registry schema v1 deliberately cannot represent trustworthy promotion, and the conformance-report artifact this gate declares is not yet emitted."
activation_checkpoint = "CP2"
backends = ["in-memory", "sqlite", "postgresql"]
required_ci = [
  ".github/workflows/test-matrix.yml#tests",
  ".github/workflows/test-matrix.yml#postgres-conformance",
]

[gates.evidence]
