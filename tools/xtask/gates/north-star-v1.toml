schema_path = "tools/xtask/schemas/gate-evidence-v1.schema.json"
artifact_path = "artifacts/north-star/v1/ns04.json"

[gates.threshold]
kind = "exact"
metric = "durable_drive_identities_per_ambiguous_acceptance"
expected = 1

